
services:
  mongodb:
    image: mongo:7.0-jammy #اسم التاج بتاع ال image
    
    container_name: mongodb
    
    ports:
     - "27007:27017"
    
    volumes:
      - mongodata:/data/db

    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME} #بيستخدم المتغيرات اللي في ملف ال .env
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    
    networks:
      - backend
    
    restart: always
  
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    ports:
      - "5450:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - backend
    restart: always

networks:
  backend:
  
volumes:
  mongodata:
  pgvector_data: